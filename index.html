<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家人感恩牆</title>
<meta name="theme-color" content="#ffc2d1">
<meta name="description" content="全家一起寫感恩日記，用愛心和感恩幣記錄每一天的小幸福">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="感恩牆">
<style>
:root{
  --bg:#fff4ee; --card:#ffffff; --pink:#ff8fab; --pink-d:#f0668c; --pink2:#ffc2d1; --pink3:#ffe5ec;
  --mint:#c9f0df; --mint-d:#6fcfa5; --gold:#ffc83d; --gold-d:#e9a800; --ink:#5b3a42; --soft:#a7838c; --line:#ffd9e2;
  --r:22px;
  --font:"Hiragino Maru Gothic ProN","jf-openhuninn","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%,#ffe0ea 0,transparent 38%),radial-gradient(circle at 92% 30%,#ffeccf 0,transparent 34%);
  background-attachment:fixed;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
textarea,input{font-family:inherit;font-size:16px;color:var(--ink)}
h2,h3{margin:0}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,244,238,.92);backdrop-filter:blur(8px);}
.logo{font-size:21px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.logo .bob{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 var(--line)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

main{max-width:560px;margin:0 auto;padding:6px 14px 20px}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 6px 0 var(--pink3),0 10px 24px rgba(240,102,140,.08);border:2px solid #fff}
.card.pink{background:var(--pink3)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:46px;height:46px;border-radius:50%;background:var(--pink3);display:grid;place-items:center;font-size:28px;flex:none;border:2px solid var(--pink2)}
.ph b{display:block;line-height:1.2}
.ph small{color:var(--soft)}
.ph .menu{margin-left:auto;display:flex;gap:2px}
.icon-btn{width:36px;height:36px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.icon-btn:active{background:var(--pink3)}
.items{margin:6px 0 8px;padding:0;list-style:none}
.items li{background:#fffaf7;border-radius:14px;padding:8px 12px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;border:1.5px dashed var(--line)}
.items li::before{content:"🌷 ";}
.to{font-size:14px;color:var(--soft);margin:4px 0 8px}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--mint);color:#2f6b55;border-radius:999px;padding:1px 10px 1px 6px;margin:2px 4px 2px 0;font-size:14px}
.act{display:flex;align-items:center;gap:10px}
.like{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--pink2);border-radius:999px;padding:4px 14px;font-weight:700;color:var(--pink-d);box-shadow:0 3px 0 var(--pink2)}
.like:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink2)}
.like.on{background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d)}
.like.self{opacity:.55}
.sub{color:var(--soft);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;box-shadow:0 5px 0 var(--pink-d);font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
.btn.block{display:flex;width:100%}
.btn.mint{background:var(--mint-d);box-shadow:0 5px 0 #4aa985}
.btn.mint:active{box-shadow:0 2px 0 #4aa985}
.btn.ghost{background:#fff;color:var(--pink-d);border:2px solid var(--pink2);box-shadow:0 4px 0 var(--pink2)}
.btn.sm{padding:6px 14px;font-size:14px;box-shadow:0 3px 0 var(--pink-d)}
.btn.sm.ghost{box-shadow:0 3px 0 var(--pink2)}
.btn.danger{background:#ff7a7a;box-shadow:0 5px 0 #d85a5a}
.btn[disabled]{opacity:.5}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;margin:0 0 12px;border:2px solid var(--line)}
.seg button{flex:1;padding:6px 0;border-radius:999px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--pink);color:#fff}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:2px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--soft);font-weight:700;padding:2px 0}
.nav button .ic{font-size:24px;line-height:1.2;transition:transform .2s}
.nav button.on{color:var(--pink-d)}
.nav button.on .ic{transform:scale(1.18)}
.nav button.plus .ic{width:58px;height:58px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:30px;
  margin-top:-26px;box-shadow:0 5px 0 var(--pink-d),0 0 0 6px #fff;transition:transform .15s}
.nav button.plus:active .ic{transform:translateY(3px)}

/* write */
.prompt{background:var(--gold);background:linear-gradient(135deg,#ffe38a,#ffd0a8);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700}
.prompt span.q{flex:1}
.field{position:relative;margin-bottom:10px}
.field textarea{width:100%;min-height:72px;resize:none;border:2.5px solid var(--pink2);border-radius:18px;padding:10px 12px 22px;background:#fff;outline:none}
.field textarea:focus{border-color:var(--pink)}
.field .cnt{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--soft)}
.field .rm{position:absolute;right:-6px;top:-8px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pick{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;color:var(--soft)}
.pick.on{background:var(--mint);border-color:var(--mint-d);color:#2f6b55}
.lbl{font-weight:800;margin:12px 0 4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--soft);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:12px;background:#fffaf7;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative;border:1.5px solid transparent}
.cal .d.has{background:var(--pink3);border-color:var(--pink2);font-weight:800}
.cal .d.today{border-color:var(--gold-d)}
.cal .d.sel{background:var(--pink);color:#fff}
.cal .d .dots{font-size:11px;line-height:1;margin-top:1px;max-width:100%;overflow:hidden}
.cal .d.empty{background:transparent}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:18px}

/* jar */
.jarwrap{text-align:center;padding-top:6px}
.jar{width:230px;max-width:70%;cursor:pointer;transition:transform .2s}
.jar.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.slip{background:#fff;border-radius:18px;padding:16px;margin:14px auto 0;max-width:420px;text-align:left;border:2.5px dashed var(--pink2);
  box-shadow:0 6px 0 var(--pink3);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* wallet */
.bal{text-align:center;padding:10px 0 4px}
.bal .big{font-size:52px;font-weight:900;color:var(--gold-d);line-height:1.1;text-shadow:0 3px 0 #fff3c4}
.coin{display:inline-block;animation:spin 3.2s linear infinite;transform-style:preserve-3d}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--pink2);display:grid;place-items:center;font-size:15px;color:#fff;flex:none}
.task.done .ck{background:var(--mint-d);border-color:var(--mint-d)}
.task .tx{flex:1}
.task .rw{font-weight:800;color:var(--gold-d)}
.rank{display:flex;align-items:center;gap:10px;padding:6px 0}
.rank .no{width:26px;text-align:center;font-weight:900;color:var(--pink-d)}
.led{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.led:last-child{border-bottom:0}
.led b.p{color:#2f9b6e}.led b.m{color:#d85a5a}

/* list menu */
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 var(--pink3);font-weight:800;font-size:17px;border:2px solid #fff}
.menu-item .mi{font-size:28px}
.menu-item small{display:block;font-weight:500;color:var(--soft);font-size:13px}
.back{margin:0 0 10px;font-weight:800;color:var(--pink-d)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat .s{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 0 var(--pink3)}
.stat .s b{display:block;font-size:28px;color:var(--pink-d);line-height:1.2}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .tr{flex:1;height:14px;background:var(--pink3);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:999px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.avgrid button{aspect-ratio:1;border-radius:16px;background:#fff;border:2.5px solid var(--line);font-size:26px}
.avgrid button.on{border-color:var(--pink);background:var(--pink3)}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolebtn{background:#fff;border-radius:22px;padding:16px 8px;text-align:center;font-weight:800;box-shadow:0 5px 0 var(--pink3);border:2px solid #fff}
.rolebtn .e{font-size:46px;display:block;line-height:1.2}
.rolebtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink3)}
.input{width:100%;border:2.5px solid var(--pink2);border-radius:16px;padding:10px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--pink)}
.row{display:flex;gap:8px;align-items:center}
.row .input{flex:1}
.notice{background:#fff7d6;border:2px solid #ffe38a;border-radius:16px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.notice.warn{background:#ffe9e9;border-color:#ffb4b4}
.welcome{text-align:center;padding:30px 4px 10px}
.welcome .big{font-size:64px;animation:bob 2.4s ease-in-out infinite;display:inline-block}
.empty{text-align:center;color:var(--soft);padding:34px 10px}
.empty .e{font-size:54px;display:block}

/* floating hearts & coins */
.floaty{position:fixed;pointer-events:none;z-index:100;will-change:transform,opacity;animation:floatUp var(--dur,1.8s) ease-out var(--delay,0s) forwards;opacity:0}
@keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-70vh) scale(var(--sc,1.2)) rotate(var(--rot,0deg))}}
.coinpop{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:110;pointer-events:none;background:#fff;border:3px solid var(--gold);color:var(--gold-d);
  font-weight:900;font-size:26px;border-radius:999px;padding:8px 22px;box-shadow:0 6px 0 #ffe9a3,0 12px 30px rgba(233,168,0,.3);animation:coinpop 1.7s ease-out forwards;white-space:nowrap}
@keyframes coinpop{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}30%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:120;font-size:15px;max-width:88vw;text-align:center;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}

/* modal */
.modal{position:fixed;inset:0;z-index:150;background:rgba(91,58,66,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet img{width:100%;border-radius:14px;margin-bottom:10px;border:2px solid var(--line);display:block}
.sheet .row{position:sticky;bottom:0;background:var(--bg);padding-top:6px}
.banner{background:#fff;border-bottom:2px solid var(--line);padding:8px 14px;font-size:14px;text-align:center}
</style>

<script id="logic">
window.GL = (function () {
  const COINS = { login: 1, post: 3, likeGive: 1, likeGet: 1, likeCap: 5 };
  const DOW = ['日', '一', '二', '三', '四', '五', '六'];

  // 台灣時間（UTC+8）的日期 YYYY-MM-DD
  function tpDate(ms) { return new Date(ms + 8 * 3600 * 1000).toISOString().slice(0, 10); }
  function addDays(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
  function dow(d) { return new Date(Date.parse(d + 'T00:00:00Z')).getUTCDay(); }
  function fmtDate(d) { return Number(d.slice(5, 7)) + '月' + Number(d.slice(8, 10)) + '日 週' + DOW[dow(d)]; }
  function monthOf(d) { return d.slice(0, 7); }
  function addMonths(m, n) {
    const y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) - 1 + n;
    const yy = y + Math.floor(mo / 12), mm = ((mo % 12) + 12) % 12;
    return yy + '-' + String(mm + 1).padStart(2, '0');
  }
  function daysInMonth(m) { return new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0)).getUTCDate(); }

  // 連續天數：今天寫過就從今天算，否則從昨天算
  function streak(dateSet, today) {
    let d = dateSet.has(today) ? today : addDays(today, -1), n = 0;
    while (dateSet.has(d)) { n++; d = addDays(d, -1); }
    return n;
  }
  function balance(ledger, mid) {
    let s = 0;
    for (const k in ledger) if (ledger[k].member === mid) s += ledger[k].amount;
    return s;
  }
  function likeGivenToday(ledger, mid, date) {
    let n = 0;
    for (const k in ledger) { const e = ledger[k]; if (e.member === mid && e.type === 'like_give' && e.date === date) n++; }
    return n;
  }
  // 按讚：不能讚自己、每篇一人一次；每人每天最多 5 次有幣，超過仍可讚但雙方都不給幣
  function planLike(o) {
    const post = o.post, liker = o.likerId, date = o.date;
    if (post.author === liker) return { ok: false, reason: 'self' };
    const likeId = post.id + '_' + liker;
    if (o.likes[likeId]) return { ok: false, reason: 'dup' };
    const entries = [];
    if (likeGivenToday(o.ledger, liker, date) < COINS.likeCap) {
      entries.push({ id: 'lg_' + post.id + '_' + liker, type: 'like_give', member: liker, amount: COINS.likeGive, date: date, post: post.id });
      entries.push({ id: 'lr_' + post.id + '_' + liker, type: 'like_get', member: post.author, amount: COINS.likeGet, date: date, post: post.id, from: liker });
    }
    return { ok: true, likeId: likeId, entries: entries };
  }
  // 刪除文章：連同這篇文章產生的所有幣、愛心一起收回
  function planDelete(post, ledger, likes) {
    const ledgerIds = [], likeIds = [];
    for (const k in ledger) if (ledger[k].post === post.id) ledgerIds.push(k);
    for (const k in likes) if (likes[k].post === post.id) likeIds.push(k);
    return { ledgerIds: ledgerIds, likeIds: likeIds };
  }
  function likeCount(likes, postId) {
    let n = 0; for (const k in likes) if (likes[k].post === postId) n++; return n;
  }
  const LEDGER_LABEL = { login: '每日登入', post: '寫感恩日記', like_give: '按讚送出愛心', like_get: '收到愛心' };

  function monthStats(posts, likes, month) {
    const list = Object.values(posts).filter(p => p.date.slice(0, 7) === month);
    const byAuthor = {}, thanked = {};
    list.forEach(p => {
      byAuthor[p.author] = (byAuthor[p.author] || 0) + 1;
      (p.to || []).forEach(t => { thanked[t] = (thanked[t] || 0) + 1; });
    });
    let top = null, topN = -1;
    list.forEach(p => { const n = likeCount(likes, p.id); if (n > topN) { topN = n; top = p; } });
    let heartTotal = 0; list.forEach(p => { heartTotal += likeCount(likes, p.id); });
    const days = new Set(list.map(p => p.date));
    return { posts: list.length, byAuthor: byAuthor, thanked: thanked, top: top, topLikes: Math.max(topN, 0), hearts: heartTotal, activeDays: days.size };
  }
  async function sha(text) {
    try {
      if (window.crypto && crypto.subtle) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gl:' + text));
        return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) {}
    let h = 5381; const s = 'gl:' + text; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
  return { COINS, DOW, tpDate, addDays, dow, fmtDate, monthOf, addMonths, daysInMonth, streak, balance, likeGivenToday, planLike, planDelete, likeCount, LEDGER_LABEL, monthStats, sha };
})();
</script>

/* ───────── 資料層：Firestore 或本機 ───────── */
async function makeDB() {
  if (FIREBASE_CONFIG) {
    const V = '10.14.1';
    const A = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js');
    const F = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js');
    const fs = F.getFirestore(A.initializeApp(FIREBASE_CONFIG));
    return {
      mode: 'cloud',
      sub: (n, cb) => F.onSnapshot(F.collection(fs, PREFIX + n), snap => {
        const m = {}; snap.forEach(d => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); }); cb(m);
      }, err => console.error('Firestore', n, err)),
      set: (n, id, data) => F.setDoc(F.doc(fs, PREFIX + n, id), data),
      update: (n, id, patch) => F.updateDoc(F.doc(fs, PREFIX + n, id), patch),
      del: (n, id) => F.deleteDoc(F.doc(fs, PREFIX + n, id))
    };
  }
  const listeners = {};
  const read = n => { try { return JSON.parse(localStorage.getItem('glc_' + n) || '{}'); } catch (e) { return {}; } };
  const write = (n, m) => { localStorage.setItem('glc_' + n, JSON.stringify(m)); (listeners[n] || []).forEach(cb => cb(read(n))); };
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith('glc_')) { const n = e.key.slice(4); (listeners[n] || []).forEach(cb => cb(read(n))); } });
  return {
    mode: 'local',
    sub: (n, cb) => { (listeners[n] = listeners[n] || []).push(cb); setTimeout(() => cb(read(n)), 0); },
    set: async (n, id, d) => { const m = read(n); m[id] = Object.assign({}, d, { id }); write(n, m); },
    update: async (n, id, p) => { const m = read(n); m[id] = Object.assign({}, m[id] || {}, p, { id }); write(n, m); },
    del: async (n, id) => { const m = read(n); delete m[id]; write(n, m); }
  };
}

function burstHearts(n, fromEl) {
  const syms = ['💗', '💖', '💕', '❤️', '💝', '🩷', '✨'];
  let ox = innerWidth / 2, oy = innerHeight * 0.75;
  if (fromEl) { const r = fromEl.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2; }
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div'); h.className = 'floaty'; h.textContent = syms[i % syms.length];
    const spread = fromEl ? 120 : innerWidth * 0.8;
    h.style.left = (ox + (Math.random() - 0.5) * (fromEl ? 30 : spread * 0.5)) + 'px';
    h.style.top = oy + 'px';
    h.style.fontSize = (20 + Math.random() * 26) + 'px';
    h.style.setProperty('--dx', ((Math.random() - 0.5) * spread) + 'px');
    h.style.setProperty('--rot', ((Math.random() - 0.5) * 60) + 'deg');
    h.style.setProperty('--sc', (0.9 + Math.random() * 0.8));
    h.style.setProperty('--dur', (1.4 + Math.random() * 1.2) + 's');
    h.style.setProperty('--delay', (Math.random() * (fromEl ? 0.25 : 0.7)) + 's');
    document.body.appendChild(h); setTimeout(() => h.remove(), 3600);
  }
}

/* ───────── 寫入帳本（重複編號直接略過） ───────── */
async function grant(entry) {
  if (S.ledger[entry.id]) return false;
  const e = Object.assign({ at: Date.now() }, entry);
  S.ledger[entry.id] = e; // 先更新本機，避免連點重複領
  try { await DB.set('ledger', entry.id, e); return true; }
  catch (err) { delete S.ledger[entry.id]; console.warn('ledger write failed', err); return false; }
}

/* ───────── 啟動 ───────── */
async function boot() {
  DB = await makeDB();
  ['members', 'posts', 'likes', 'ledger', 'settings'].forEach(n => DB.sub(n, m => { S[n] = m; S.ready[n] = true; onData(); }));
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'more') refresh(); });
  render();
}
async function onData() {
  const R = S.ready;
  if (!(R.members && R.posts && R.likes && R.ledger && R.settings)) return;
  if (!S.settings.main) {
    S.settings.main = { id: 'main', roles: DEFAULT_ROLES, adminHash: await GL.sha('0000'), updatedAt: Date.now() };
    DB.set('settings', 'main', S.settings.main).catch(() => {});
  }
  if (S.me && !S.members[S.me]) { S.me = null; localStorage.removeItem('gl_me'); }
  if (S.me && !S.loginDone) {
    S.loginDone = true;
    const ok = await grant({ id: 'login_' + today() + '_' + S.me, type: 'login', member: S.me, amount: GL.COINS.login, date: today() });
    if (ok) setTimeout(() => { coinPop('每日登入 +' + GL.COINS.login); burstHearts(6); }, 500);
  }
  refresh();
}
function refresh() { if (S.tab === 'write' && S.me) { updateTop(); return; } render(); }

/* ───────── 匯出成 JPG（Canvas 手繪，不依賴外部套件） ───────── */
const INK = '#5b3a42', SOFT = '#a7838c', PINK = '#ff8fab';
const F = (w, s) => w + ' ' + s + 'px "PingFang TC","Hiragino Sans GB","Noto Sans TC","Microsoft JhengHei",sans-serif';
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrapText(ctx, text, maxW) {
  const out = []; String(text).split('\n').forEach(par => { let line = ''; for (const ch of par) { const t = line + ch; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; } else line = t; } out.push(line); }); return out;
}
function bg(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#ffe3ec'); g.addColorStop(1, '#fff1dc'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = .55; ctx.font = '56px sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i < 14; i++) { ctx.fillText(['💗', '✨', '🌷', '⭐'][i % 4], (i * 197 + 80) % w, (i * 331 + 120) % h); } ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
// 畫（或只量高度）一張貼文卡
function layoutPost(ctx, p, x, y, w, draw) {
  const pad = 36, inner = w - pad * 2; let cy = y + pad;
  const heart = GL.likeCount(S.likes, p.id), to = (p.to || []).map(t => memberAv(t) + memberName(t)).join('、');
  if (draw) {
    ctx.fillStyle = '#fff'; rr(ctx, x, y, w, layoutPost(ctx, p, x, y, w, false), 34); ctx.fill();
    ctx.fillStyle = '#ffe5ec'; ctx.beginPath(); ctx.arc(x + pad + 40, cy + 40, 40, 0, 7); ctx.fill();
    ctx.font = '46px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(memberAv(p.author), x + pad + 40, cy + 44);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK; ctx.font = F(700, 36); ctx.fillText(memberName(p.author), x + pad + 100, cy + 36);
    ctx.fillStyle = SOFT; ctx.font = F(400, 26); ctx.fillText(GL.fmtDate(p.date), x + pad + 100, cy + 74);
  }
  cy += 104;
  p.items.forEach(t => {
    ctx.font = F(500, 34); const lines = wrapText(ctx, '🌷 ' + t, inner - 40), bh = lines.length * 50 + 24;
    if (draw) { ctx.fillStyle = '#fffaf7'; rr(ctx, x + pad, cy, inner, bh, 22); ctx.fill(); ctx.fillStyle = INK; ctx.font = F(500, 34); lines.forEach((l, i) => ctx.fillText(l, x + pad + 20, cy + 46 + i * 50)); }
    cy += bh + 12;
  });

function drawSingle(p) {

function drawMonthPages(month) {

  const probe = mkCanvas(10, 10).getContext('2d'), pages = [[]]; let y = 230;
  posts.forEach(p => { const ph = layoutPost(probe, p, 60, 0, W - 120, false); if (y + ph > H - 110 && pages[pages.length - 1].length) { pages.push([]); y = 230; } pages[pages.length - 1].push({ p, h: ph }); y += ph + 28; });

    const c = mkCanvas(W, H), ctx = c.getContext('2d'); bg(ctx, W, H);

    ctx.fillStyle = SOFT; ctx.font = F(500, 28); ctx.fillText('第 ' + (i + 1) + ' / ' + pages.length + ' 頁　·　共 ' + posts.length + ' 篇', W / 2, 176); ctx.textAlign = 'left';
    let yy = 230; pg.forEach(o => { layoutPost(ctx, o.p, 60, yy, W - 120, true); yy += o.h + 28; });

function drawReview(month) {
  const W = 1080, st = GL.monthStats(S.posts, S.likes, month), probe = mkCanvas(10, 10).getContext('2d');

    if (!keys.length) { ctx.fillStyle = SOFT; ctx.font = F(400, 28); ctx.fillText('這個月還沒有資料', 60, y + 46); y += 90; return; }

  };

  if (showTop) {

  }
  ctx.fillStyle = SOFT; ctx.font = F(400, 26); ctx.textAlign = 'center'; ctx.fillText('🌸 家人感恩牆', W / 2, H - 50); ctx.textAlign = 'left';

}
function toBlob(c) { return new Promise(r => c.toBlob(r, 'image/jpeg', 0.92)); }
async function exportImages(title, canvases, name) {
  toast('正在製作圖片…');
  const blobs = await Promise.all(canvases.map(toBlob)), urls = blobs.map(b => URL.createObjectURL(b));
  const files = blobs.map((b, i) => new File([b], name + (blobs.length > 1 ? '-' + (i + 1) : '') + '.jpg', { type: 'image/jpeg' }));
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="sheet"><h3 style="margin-bottom:4px">🖼️ ' + esc(title) + '</h3><p class="sub" style="margin:0 0 10px">共 ' + blobs.length + ' 張。可以按下面的按鈕，或直接長按圖片存到相簿。</p>' + urls.map(u => '<img src="' + u + '" alt="">').join('') +
    '<div class="row"><button class="btn block" data-x="share">📤 分享 / 存到相簿</button><button class="btn ghost" data-x="close">關閉</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', async e => {
    if (e.target === m || (e.target.dataset && e.target.dataset.x === 'close')) { m.remove(); urls.forEach(u => URL.revokeObjectURL(u)); return; }
    if (e.target.dataset && e.target.dataset.x === 'share') {
      if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files, title }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
      files.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = urls[i]; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }, i * 400));
    }
  });
}
function exportMonth(month) {
  if (!Object.values(S.posts).some(p => p.date.slice(0, 7) === month)) { toast('這個月還沒有日記'); return; }
  exportImages(month.replace('-', ' 年 ') + ' 月日記', drawMonthPages(month), 'gratitude-' + month);
}
